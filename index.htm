<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Цікаві Факти про Тварин</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: rgba(255, 255, 255, 0.1);
            --accent-color: #4ecca3;
            --error-color: #ff4b2b;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #game-container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 { font-size: 24px; margin-bottom: 10px; color: var(--accent-color); text-transform: uppercase; letter-spacing: 2px; }

        .score-box {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .record-text { color: #ffd700; }

        #character-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-color);
            margin: 15px auto;
            background: #222;
            display: block;
            box-shadow: 0 0 20px rgba(78, 204, 163, 0.3);
        }

        .fact-text {
            min-height: 100px;
            font-size: 18px;
            margin: 20px 0;
            line-height: 1.4;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-yes { background-color: var(--accent-color); color: #1a1a2e; }
        .btn-no { background-color: var(--error-color); color: white; }

        button:active { transform: scale(0.95); }

        #menu, #game-over {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Дозволяємо листати вгору та вниз, якщо контенту багато */
            overflow-y: auto;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .hidden { display: none !important; }

        .btn-main {
            background: var(--accent-color);
            padding: 20px 50px;
            font-size: 24px;
            margin-top: 20px;
            border-radius: 50px;
        }

        .btn-reset {
            background: transparent;
            color: #888;
            font-size: 14px;
            margin-top: 30px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="menu">
        <h1>ЦІКАВІ ФАКТИ</h1>
        <p>Вгадай факт про улюбленців!</p>
        <div class="record-text">🏆 Рекорд: <span id="menu-record">0</span></div>
        <button class="btn-main" onclick="startGame()">ПОЧАТИ</button>
        <button class="btn-reset" onclick="resetRecord()">Скинути рекорд</button>
    </div>

    <div id="game-container" class="hidden">
        <div class="score-box">
            <div>Рахунок: <span id="current-score">0</span></div>
            <div class="record-text">Рекорд: <span id="game-record">0</span></div>
        </div>
        
        <img id="character-img" src="" alt="Тваринка">
        <h2 id="character-name" style="margin: 5px 0; color: var(--accent-color);"></h2>
        
        <div class="fact-text" id="fact-display">Завантаження факту...</div>

        <div class="btn-group">
            <button class="btn-yes" onclick="checkAnswer(true)">ТАК</button>
            <button class="btn-no" onclick="checkAnswer(false)">НІ</button>
        </div>
    </div>

    <div id="game-over" class="hidden">
        <h1 style="color: var(--error-color);">ОЙ! ПОМИЛКА</h1>
        <p id="final-score-text">Твій результат: 0</p>
        <button class="btn-main" onclick="startGame()">ЗНОВУ</button>
        <button class="btn-reset" onclick="backToMenu()">В меню</button>
    </div>

    <script>
        const characters = [
            { name: "Tito", img: "Tito.png", type: "dog" },
            { name: "Smartik", img: "Smartik.png", type: "dog" },
            { name: "Fil", img: "Fil.png", type: "dog" },
            { name: "Junior", img: "Junior.png", type: "cat" },
            { name: "Milka", img: "Milka.png", type: "cat" },
            { name: "Bark", img: "Bark.png", type: "dog" },
            { name: "Persik", img: "Persik.png", type: "pet" },
            { name: "Spike", img: "Spike.png", type: "pet" },
            { name: "Alyonka", img: "Alyonka.png", type: "pet" },
            { name: "Lilu", img: "Lilu.png", type: "pet" },
            { name: "Manya", img: "Manya.png", type: "pet" },
            { name: "Liza", img: "Liza.png", type: "pet" },
            { name: "Grivna", img: "Grivna.png", type: "pet" },
            { name: "Ben", img: "Ben.png", type: "pet" },
            { name: "Goldi", img: "Goldi.png", type: "pet" },
            { name: "Raf", img: "Raf.png", type: "pet" },
            { name: "Veles", img: "Veles.png", type: "pet" },
            { name: "Masha", img: "Masha.png", type: "pet" },
            { name: "Brilliantik", img: "Brilliantik.png", type: "pet" },
            { name: "Richik", img: "Richik.png", type: "pet" },
            { name: "Shunya", img: "Shunya.png", type: "pet" },
            { name: "Baks", img: "Baks.png", type: "pet" }
        ];

        let score = 0;
        let highscore = localStorage.getItem('petGameRecord') || 0;
        let currentQuestion = null;

        const factTemplates = [
            { q: "Якщо {name} поранить лапу, її треба промити чистою водою?", a: true },
            { q: "{name} може стрибнути вище ніж на 2 метри у висоту?", a: true },
            { q: "Чи правда, що {name} не любить, коли йому/їй чіпають вуса?", a: true },
            { q: "Чи можна годувати {name} шоколадом, бо це смачно?", a: false },
            { q: "Якщо {name} гавкає/мяукає вночі, це означає, що він бачить привидів?", a: false },
            { q: "Чи правда, що {name} вміє розрізняти понад 100 людських слів?", a: true },
            { q: "Якщо {name} захворіє, йому можна дати звичайну таблетку для людей?", a: false },
            { q: "{name} краще бачить у повній темряві, ніж людина?", a: true },
            { q: "Чи правда, що {name} пітніє через язик та подушечки лап?", a: true },
            { q: "Чи можна давати {name} пити тільки молоко замість води?", a: false },
            { q: "Якщо {name} крутиться на місці перед сном, це інстинкт предків?", a: true },
            { q: "{name} відчуває твій настрій, навіть якщо ти мовчиш?", a: true },
            // ДОДАТКОВІ НОВІ ФАКТИ
            { q: "Чи правда, що нюх у {name} у тисячі разів гостріший, ніж у людини?", a: true },
            { q: "Чи можна {name} постійно годувати солоною рибою та чипсами?", a: false },
            { q: "Чи правда, що {name} бачить сни, коли спить і посмикує лапками?", a: true },
            { q: "Якщо {name} підтискає хвоста, це означає, що він дуже радіє?", a: false },
            { q: "Чи вміє {name} чути ультразвуки, які не чують люди?", a: true },
            { q: "Чи правда, що {name} може розганятися до швидкості машини на коротких дистанціях?", a: true },
            { q: "Якщо {name} мружить очі, дивлячись на тебе, це знак довіри та любові?", a: true },
            { q: "Чи корисно для {name} пити газовану солодку воду?", a: false },
            { q: "Чи правда, що візерунок на носі у {name} унікальний, як відбиток пальця у людини?", a: true },
            { q: "Чи може {name} навчитися відчиняти двері, натискаючи на ручку?", a: true },
            { q: "Чи правда, що {name} любить грати в комп'ютерні ігри на телефоні?", a: false },
            { q: "Якщо {name} лягає спиною на підлогу і показує пузико, це означає повну довіру?", a: true },
            { q: "Чи безпечно для {name} жувати кімнатні рослини без розбору?", a: false },
            { q: "Чи правда, що {name} чує шурхіт пакета з їжею навіть з іншої кімнати?", a: true }
        ];

        function updateRecordDisplay() {
            document.getElementById('menu-record').innerText = highscore;
            document.getElementById('game-record').innerText = highscore;
        }

        function startGame() {
            score = 0;
            document.getElementById('current-score').innerText = score;
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            updateRecordDisplay();
            generateQuestion();
        }

        function generateQuestion() {
            const char = characters[Math.floor(Math.random() * characters.length)];
            const template = factTemplates[Math.floor(Math.random() * factTemplates.length)];
            
            currentQuestion = {
                text: template.q.replace(/{name}/g, char.name),
                answer: template.a
            };

            document.getElementById('character-img').src = char.img;
            document.getElementById('character-name').innerText = char.name;
            document.getElementById('fact-display').innerText = currentQuestion.text;
            
            // Заглушка, якщо картинки немає (для тесту)
            document.getElementById('character-img').onerror = function() {
                this.src = "https://via.placeholder.com/150?text=" + char.name;
            };
        }

        function checkAnswer(userAnswer) {
            if (userAnswer === currentQuestion.answer) {
                score++;
                document.getElementById('current-score').innerText = score;
                if (score > highscore) {
                    highscore = score;
                    localStorage.setItem('petGameRecord', highscore);
                    updateRecordDisplay();
                }
                generateQuestion();
            } else {
                gameOver();
            }
        }

        function gameOver() {
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('final-score-text').innerText = "Твій результат: " + score;
        }

        function resetRecord() {
            if(confirm("Ти впевнений, що хочеш скинути рекорд?")) {
                highscore = 0;
                localStorage.setItem('petGameRecord', 0);
                updateRecordDisplay();
            }
        }

        function backToMenu() {
            document.getElementById('game-over').classList.add('hidden');
            document.getElementById('menu').classList.remove('hidden');
        }

        updateRecordDisplay();
    </script>
</body>
</html>
